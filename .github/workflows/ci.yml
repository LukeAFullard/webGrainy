name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Also run by pages.yml before a manual deploy, so every deploy passes the full gate.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      # Blocking: anything that ships to users (production dependencies).
      - name: Dependency audit (shipped code)
        run: npm audit --omit=dev --audit-level=high

      # Report-only: test/build tooling (never shipped). Advisories here can have no fixed
      # release yet (e.g. picomatch GHSA-fc5q-39xc-vjpf, via vitest/vite), so they warn
      # instead of failing the build. Review the warning and update when a fix is released.
      - name: Dependency audit (dev tooling, report only)
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning title=Dev dependency advisory::npm audit reports high-severity advisories in dev-only tooling (not shipped). See the log above; update when a fix is released."
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, parity and E2E tests
        run: npm test

      # Independent numerical check: percentiles, Folk & Ward, moment-ellipse axes and
      # orientation, Feret widths, float16 encoding, tiling and homography against
      # numpy / scipy / scikit-image. Fails on any difference beyond its tolerance.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Numerical oracle (numpy / scipy / scikit-image)
        run: |
          python -m pip install --quiet numpy==2.5.5 scipy==1.18.1 scikit-image==0.26.0
          npx vitest run --config validation/oracle/vitest.config.ts
          python -I validation/oracle/oracle.py validation/oracle/ts_dump.json --check

      - name: Build
        run: npm run build

      - name: Map projections vs PROJ (every CRS in the table, built code)
        run: node validation/geotiff/check_crs_table.mjs

      - name: Cache pinned model weights (U-Net + Cellpose-SAM INT8)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          key: models-98e76b13-unet-5e692c55-cpsamint8-2cda0be5

      - name: Install Chromium for the dist smoke test
        run: npx playwright install --with-deps chromium

      # Loads the BUILT app in Chromium, checks precache assets and console errors, and runs
      # one real U-Net analysis (SHA-256-verified pinned weights, WASM backend).
      - name: Browser smoke test (dist/)
        run: npm run test:e2e:browser

      # Same check with Cellpose-SAM (INT8 weights, CPU): the more accurate model, and the
      # one whose multi-second tiles froze the page before inference moved to a worker.
      - name: Browser smoke test, Cellpose-SAM (dist/)
        run: npm run test:e2e:browser
        env:
          SMOKE_MODEL: cpsam

      # Service-worker updates with two builds and several tabs: an open tab is never
      # switched to a new build's workers, and a tab taken over by an update locks itself.
      - name: Service-worker update check (dist/)
        run: npm run test:e2e:sw
