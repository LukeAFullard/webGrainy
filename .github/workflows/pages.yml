name: Deploy app to GitHub Pages

# Builds the web app (dist/) and publishes it to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". The app is then served at https://<owner>.github.io/<repo>/
# (the GPU check page at .../gpucheck.html).

# Deploys only after the CI workflow (dependency audit, oracle, CRS check, browser and
# service-worker smoke tests) has passed on main, and deploys exactly the commit CI tested.
# A manual run ("Run workflow") runs the same CI first and deploys only if it passes.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Least privilege: only the deploy job can publish to Pages (pages: write, and id-token: write
# for the deployment's OIDC token). The build job runs npm ci and the test suite (third-party
# code), so it gets read access only.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Manual runs only: the full CI gate (pushes to main already passed it via workflow_run).
  ci:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    # Runs after `ci` passed (manual run), or with `ci` skipped after CI passed on a push to main.
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && needs.ci.result == 'success') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      )
    permissions:
      contents: read
      pages: read # actions/configure-pages reads the site's Pages settings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Only the web app: the library build (dist/index.js, dist/modules/, dist/chunks/) is not
      # used by the page.
      - name: Web app files
        run: |
          rm -rf pages && cp -r dist pages
          rm -rf pages/modules pages/chunks pages/index.js pages/index.js.map
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: pages

  deploy:
    needs: build
    # Required: without it the implicit `success()` also looks at `ci`, which is skipped on every
    # push to main (workflow_run), so the deploy was skipped too while the run still showed green.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5