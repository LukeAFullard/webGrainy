<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Content Security Policy. The only network egress is the pinned model download
    (huggingface.co, which redirects to *.hf.co CDNs). 'wasm-unsafe-eval' is required
    to compile the onnxruntime-web WebAssembly module. Inline style attributes are used
    by the UI templates. Prefer sending this (plus frame-ancestors) as an HTTP header;
    see DEPLOYMENT.md.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="dark light" />
  <meta name="text-scale" content="scale" />
  <meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f7fa" media="(prefers-color-scheme: light)" />
  <meta name="description" content="webGrainy (ImageGrains 2.0 Web) — 100% browser-native, privacy-first, offline-first gravel and sediment grain-sizing application." />
  <title>webGrainy — ImageGrains 2.0 Web</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./ui/main.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <div class="boot-splash">
      <div class="boot-title">webGrainy — ImageGrains 2.0 Web</div>
      <div class="boot-sub">Initializing local WebGPU / WASM SIMD engine &amp; offline workspace…</div>
    </div>
  </div>
  <script type="module" src="./ui/main.js"></script>
</body>
</html>
